<div class="form-controls">
	<div class="leftLabel">
		What was your age at the time of your first menstrual period?
	</div>
	<div class="rightSelect">
		<select ng-model="mage" class="mage field required" id="mage" name="mage" size="1">
			<option value="">Please Select</option>
			<option value="0">Unknown</option>
			<option value="2">7 to 11</option>
			<option value="1">12 to 13</option>
			<option value="0">&gt; =14</option>
		</select>
		<span class="errorMessage">Field Required</span>
	</div>
	<div class="clearfix"></div>
</div>

<div class="form-controls">
	<div class="leftLabel">
		What was your age at the time of your first live birth of a child?
	</div>
	<div class="rightSelect">
		<select ng-model="fbage" class="fbage field required" id="fbage" name="fbage" size="1">
			<option value="">Please Select</option>
			<option value="0">Unknown</option>
			<option value="2">No births</option>
			<option value="0">&lt; 20</option>
			<option value="1">20 to 24</option>
			<option value="2">25 to 29</option>
			<option value="3">&gt; =30</option>
		</select>
		<span class="errorMessage">Field Required</span>
	</div>
	<div class="clearfix"></div>
</div>

<div class="form-controls">
	<div class="leftLabel">
		What is your race/ethnicity?
	</div>
	<div class="rightSelect">
		<select ng-model="race" ng-change="raceChange()" class='race field required' id="race" name="race" size="1">
			<option value="">Please Select</option>
			<option value="1">White</option>
			<option value="2">African American</option>
			<option value="3">Hispanic</option>
			<option value="4">Asian-American</option>

		</select>
		<span class="errorMessage">Field Required</span>
	</div>
	<div class="clearfix"></div>
</div>
