<template>
    <header class="cr-page-header">
        <div class="cr-page-header__lead">
            <div class={iconWrapClass}>
                <lightning-icon icon-name={iconName} size="small"></lightning-icon>
            </div>
            <div class="cr-page-header__text">
                <template if:true={eyebrow}>
                    <p class="cr-page-header__eyebrow">{eyebrow}</p>
                </template>
                <h1 class="cr-page-header__title">{title}</h1>
                <template if:true={subtitle}>
                    <p class="cr-page-header__subtitle">{subtitle}</p>
                </template>
            </div>
        </div>
        <div class="cr-page-header__actions">
            <slot name="actions"></slot>
        </div>
    </header>
</template>
